<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Define Staffing Academy</title>

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color:white;
    }

    .card{
      width:90%;
      max-width:420px;
      background: rgba(255,255,255,0.08);
      padding:40px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.4);
      backdrop-filter: blur(12px);
    }

    .logo{
      width:110px;
      height:110px;
      margin:0 auto 20px;
      background:white;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#1e3a8a;
      font-weight:bold;
    }

    h1{
      margin:10px 0;
      font-size:22px;
    }

    p{
      font-size:14px;
      opacity:0.8;
    }

    .btn{
      margin-top:20px;
      padding:12px 20px;
      border:none;
      border-radius:10px;
      background:#3b82f6;
      color:white;
      cursor:pointer;
      font-size:15px;
      transition:0.3s;
    }

    .btn:hover{
      background:#2563eb;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      LOGO
    </div>

    <h1>Define Staffing Academy</h1>
    <p>Plataforma profesional de gestión y capacitación</p>

    <button class="btn" onclick="location.href='dashboard.html'">
      Ingresar
    </button>

  </div>

</body>
</html>
