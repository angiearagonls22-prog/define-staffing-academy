<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Define Staffing Academy</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#0d0d0d;
            color:white;
        }

        header{

            background:black;
            padding:20px;
            display:flex;
            justify-content:space-between;
            align-items:center;

            border-bottom:3px solid #54ff9f;
        }

        .logo{

            font-size:30px;
            font-weight:bold;
            color:#54ff9f;

        }

        nav a{

            color:white;
            text-decoration:none;
            margin-left:25px;
            transition:.3s;

        }

        nav a:hover{

            color:#54ff9f;

        }

        .hero{

            height:85vh;

            display:flex;

            flex-direction:column;

            justify-content:center;

            align-items:center;

            text-align:center;

            padding:30px;

        }

        h1{

            font-size:60px;
            margin-bottom:20px;

        }

        p{

            font-size:22px;

            color:#cccccc;

            max-width:700px;

            margin-bottom:40px;

        }

        .boton{

            background:#54ff9f;

            color:black;

            text-decoration:none;

            padding:18px 45px;

            border-radius:40px;

            font-size:20px;

            font-weight:bold;

            transition:.3s;

        }

        .boton:hover{

            transform:scale(1.08);

        }

    </style>

</head>

<body>

<header>

<div class="logo">

DEFINE STAFFING

</div>

<nav>

<a href="#">Inicio</a>

<a href="#">Academia</a>

<a href="#">Contacto</a>

</nav>

</header>

<section class="hero">

<h1>

DEFINE STAFFING ACADEMY

</h1>

<p>

Bienvenido a la plataforma oficial de capacitación.

Aquí encontrarás videos, manuales y procesos de la empresa para fortalecer tus conocimientos.

</p>

<a class="boton" href="#">

Ingresar

</a>

</section>

</body>

</html>
